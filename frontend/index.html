<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Study Buddy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --accent: #7c6af7;
            --accent-dim: #3d3580;
            --text: #e8e9f0;
            --text-muted: #6b6f85;
            --user-bubble: #1e2235;
            --ai-bubble: #151820;
            --green: #4ade80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }

        .logo {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            gap: 6px;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .role-label {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            border: 1px solid var(--accent-dim);
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .thinking .bubble {
            color: var(--text-muted);
            font-style: italic;
        }

        #input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            max-height: 140px;
            transition: border-color 0.15s;
        }

        #user-input:focus {
            border-color: var(--accent);
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .empty-state .big {
            font-size: 32px;
        }

        .empty-state p {
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }

        .empty-state code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: var(--surface);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent);
        }

        #upload-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        #upload-btn:hover {
            opacity: 0.7;
        }

        #upload-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">&gt;_</div>
        <h1>CS Study Buddy</h1>
        <div class="status">
            <div class="dot"></div>
            <span>llama-3.3-70b</span>
        </div>
        <div id="upload-area">
            <input type="file" id="pdf-input" accept=".pdf" style="display:none" />
            <button id="upload-btn" onclick="document.getElementById('pdf-input').click()">
                + Upload Notes
            </button>
            <span id="upload-status"></span>
        </div>
    </header>

    <div id="chat-window">
        <div class="empty-state" id="empty-state">
            <div class="big">🧠</div>
            <p>Ask me anything CS — DSA, OS, CN, DBMS, System Design.<br />
                I'll explain clearly, give you complexity, and quiz you back.</p>
            <p>Try: <code>explain binary search trees</code> or <code>what is a deadlock?</code></p>
        </div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Ask a CS question..."></textarea>
        <button id="send-btn">Send</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
